x-nvidia-env: &nvidia-env
  NVIDIA_VISIBLE_DEVICES: all
  NVIDIA_DRIVER_CAPABILITIES: compute,video,utility
  TZ: ${TZ:-America/Sao_Paulo}

services:
  # Puxa o DVRIP da câmera e transcodifica em GPU (hevc_cuvid -> h264_nvenc).
  # A tag -hardware é a que traz o ffmpeg com CUDA.
  go2rtc:
    image: alexxit/go2rtc:latest-hardware
    container_name: cam_go2rtc
    network_mode: host
    restart: unless-stopped
    runtime: nvidia
    environment:
      <<: *nvidia-env
    volumes:
      - ./go2rtc:/config          # rw: a API cadastra os streams derivados pela API REST
      - ./data/talk:/talk:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # Só remux (copy) + gravação em disco. Não transcodifica mais nada.
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    container_name: cam_mediamtx
    network_mode: host
    restart: unless-stopped
    environment:
      # IP da LAN anunciado pelo WebRTC (ICE); sobrepõe webrtcAdditionalHosts do yml
      MTX_WEBRTCADDITIONALHOSTS: ${SERVER_IP:?defina SERVER_IP no .env}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - ./storage/recordings:/recordings
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    build: ./api
    image: cam-api:local
    container_name: cam_api
    network_mode: host
    restart: unless-stopped
    runtime: nvidia          # a reprodução de gravações também codifica em NVENC
    env_file: .env
    environment:
      <<: *nvidia-env
    volumes:
      - ./storage/recordings:/recordings
      - ./data:/data
      - ./go2rtc:/config          # a API gera o go2rtc.yaml a partir de cameras.json
      - ./web:/app/web:ro
    depends_on:
      - mediamtx
      - go2rtc
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
