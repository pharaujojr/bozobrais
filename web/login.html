<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#090b0f"/>
<title>BozoBráis — entrar</title>
<link rel="icon" type="image/svg+xml" href="logo.svg?v=2"/>
<link rel="icon" type="image/png" sizes="64x64" href="icon-64.png?v=2"/>
<link rel="apple-touch-icon" href="icon-180.png?v=2"/>
<link rel="manifest" href="manifest.json" crossorigin="use-credentials"/>
<meta name="apple-mobile-web-app-title" content="BozoBráis"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<style>
  :root{
    --bg:#090b0f; --surface:#10141b; --surface2:#161b24;
    --line:#1f2631; --line2:#2b3442;
    --tx:#eef2f8; --mut:#94a0b2; --dim:#5f6b7d;
    --acc:#4c8dff; --acc2:#6fa3ff; --acc-ring:rgba(76,141,255,.35);
    --danger:#f0525b;
    --r:16px; --r-sm:9px;
    --sh-lg:0 30px 70px -24px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.03);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--tx);
    font-family:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:15px; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  form{
    width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line);
    border-radius:var(--r); box-shadow:var(--sh-lg); padding:28px 24px 24px;
    display:flex; flex-direction:column; gap:14px;
  }
  .brand{display:flex; align-items:center; gap:12px; margin-bottom:6px}
  .brand img{width:40px; height:40px}
  .brand h1{margin:0; font-size:20px; font-weight:650; letter-spacing:-.01em}
  .brand p{margin:2px 0 0; color:var(--mut); font-size:13px}
  label{display:flex; flex-direction:column; gap:6px; color:var(--mut); font-size:13px}
  input{
    font:inherit; color:var(--tx); background:var(--surface2); border:1px solid var(--line2);
    border-radius:var(--r-sm); padding:11px 12px; outline:none;
  }
  input:focus{border-color:var(--acc); box-shadow:0 0 0 3px var(--acc-ring)}
  button{
    font:inherit; font-weight:600; color:#fff; background:var(--acc); border:0;
    border-radius:var(--r-sm); padding:12px; margin-top:4px; cursor:pointer;
  }
  button:hover{background:var(--acc2)}
  .err{display:none; color:var(--danger); font-size:13px; margin:0}
  .err.on{display:block}
  .hint{color:var(--dim); font-size:12px; text-align:center; margin:4px 0 0}
</style>
</head>
<body>
<form method="post" action="/login" autocomplete="on">
  <div class="brand">
    <img src="logo.svg?v=2" alt=""/>
    <div><h1>BozoBráis</h1><p>Câmeras</p></div>
  </div>
  <p class="err" id="err" role="alert"></p>
  <label>Usuário
    <input name="user" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus/>
  </label>
  <label>Senha
    <input name="password" type="password" autocomplete="current-password" required/>
  </label>
  <input type="hidden" name="next" id="next" value="/"/>
  <button type="submit">Entrar</button>
  <p class="hint">Este aparelho fica conectado.</p>
</form>
<script>
  const q = new URLSearchParams(location.search);
  // o #cam/<id> não chega ao servidor: junta aqui para voltar à mesma câmera
  document.getElementById('next').value = (q.get('next') || '/') + (q.get('next')?.includes('#') ? '' : location.hash);
  const err = document.getElementById('err');
  if(q.get('erro') === 'bloqueado'){ err.textContent = 'Muitas tentativas erradas. Espere 15 minutos.'; err.classList.add('on'); }
  else if(q.get('erro')){ err.textContent = 'Usuário ou senha incorretos.'; err.classList.add('on'); }
</script>
</body>
</html>
